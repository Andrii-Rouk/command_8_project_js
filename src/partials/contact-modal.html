<div class="contact-modal-overlay" id="modal">
  <div class="contact-modal">
    <button class="cont-close-btn">
      <svg class="btn" width="14.06" height="14.06">
        <use href="../public/icons/sprite.svg#close"></use>
      </svg>
    </button>

    <section class="contact-section-title">
      <h1 class="contact-modal-title">Register</h1>
      <p class="contact-modal-text">Cozy Book Club — "The Midnight Library"</p>
    </section>

    <form class="contact-modal-form">
      <div class="contact-modal-inputs">
        <div class="contact-name contact-input">
          <label class="contact-form-label" for="input-name">Name*</label>
          <input
            class="contact-form-input"
            name="name"
            id="input-name"
            type="text"
            autofocus
            placeholder="Ann"
            required
          />
          <p class="contact-form-error is-hidden">Please enter your name.</p>
        </div>

        <div class="contact-email contact-input">
          <label class="contact-form-label" for="input-email">Email*</label>
          <input
            class="contact-form-input"
            name="email"
            id="input-email"
            type="email"
            placeholder="hello@booksy.com"
            required
          />
          <p class="contact-form-error is-hidden">
            Please enter a valid email address.
          </p>
        </div>

        <div class="contact-message contact-input">
          <label class="contact-form-label" for="input-message">Message</label>
          <textarea
            class="contact-area-input"
            name="message"
            id="input-message"
            rows="5"
            placeholder="Type your message..."
          ></textarea>
          <p class="contact-form-error is-hidden">Please enter your message.</p>
        </div>
      </div>

      <button class="contact-register-btn" type="submit">Register</button>
    </form>
  </div>
</div>
