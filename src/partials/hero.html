<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <div class="hero-slider swiper">
      <ul class="swiper-wrapper list-reset">
        <li class="hero-slide swiper-slide">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/desktop/hero-01-first-order-1312w.webp 1312w,
                ./img/desktop/hero-01-first-order-1536w.webp 1536w
              "
              sizes="1312px"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/tablet/hero-01-first-order-704w.webp   704w,
                ./img/tablet/hero-01-first-order-1408w.webp 1408w
              "
              sizes="704px"
            />
            <img
              class="hero-image"
              src="./img/mobile/hero-01-first-order-343w.webp"
              srcset="
                ./img/mobile/hero-01-first-order-343w.webp 1x,
                ./img/mobile/hero-01-first-order-686w.webp 2x
              "
              alt="An open book and a cup on a table"
            />
          </picture>
          <div class="hero-content">
            <p>Get 10% off your first order</p>
            <a href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="hero-slide swiper-slide">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/desktop/hero-02-save-15-1312w.webp 1312w,
                ./img/desktop/hero-02-save-15-1536w.webp 1536w
              "
              sizes="1312px"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/tablet/hero-02-save-15-704w.webp   704w,
                ./img/tablet/hero-02-save-15-1408w.webp 1408w
              "
              sizes="704px"
            />
            <img
              class="hero-image"
              src="./img/mobile/hero-02-save-15-343w.webp"
              srcset="
                ./img/mobile/hero-02-save-15-343w.webp 1x,
                ./img/mobile/hero-02-save-15-686w.webp 2x
              "
              alt="An open book and glasses on a table"
            />
          </picture>
          <div class="hero-content">
            <p>Save 15% on some books</p>
            <a href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="hero-slide swiper-slide">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="./img/desktop/hero-03-summer-sale-704w.webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="./img/tablet/hero-03-summer-sale-704w.webp"
            />
            <img
              class="hero-image"
              src="./img/mobile/hero-03-summer-sale-343w.webp"
              srcset="
                ./img/mobile/hero-03-summer-sale-343w.webp 1x,
                ./img/mobile/hero-03-summer-sale-686w.webp 2x
              "
              alt="Shelves filled with books"
            />
          </picture>
          <div class="hero-content">
            <p>Summer Sale! Up to -40% discounts</p>
            <a href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="hero-slide swiper-slide">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="./img/desktop/hero-04-spring-bestsellers-1024w.webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/tablet/hero-04-spring-bestsellers-704w.webp   704w,
                ./img/tablet/hero-04-spring-bestsellers-1024w.webp 1024w
              "
              sizes="704px"
            />
            <img
              class="hero-image"
              src="./img/mobile/hero-04-spring-bestsellers-343w.webp"
              srcset="
                ./img/mobile/hero-04-spring-bestsellers-343w.webp 1x,
                ./img/mobile/hero-04-spring-bestsellers-686w.webp 2x
              "
              alt="An open book with glasses beside a vase"
            />
          </picture>
          <div class="hero-content">
            <p>Last chance to buy our spring bestsellers</p>
            <a href="#books">Shop Now!</a>
          </div>
        </li>
      </ul>
    </div>
    <div class="hero-bottom">
      <h1 class="hero-title" id="hero-title">
        Discover Your Next Great Read Today!
      </h1>

      <div class="hero-controls">
        <button
          type="button"
          class="hero-prev"
          aria-label="Previous slide"
          disabled
        >
          <svg width="24" height="24" aria-hidden="true">
            <use href="./icons/sprite.svg#arrow-left"></use>
          </svg>
        </button>

        <button type="button" class="hero-next" aria-label="Next slide">
          <svg width="24" height="24" aria-hidden="true">
            <use href="./icons/sprite.svg#arrow-right"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
