<section class="books-section" id="books" aria-labelledby="books-title">
  <div class="container">
    <h2 class="visually-hidden" id="books-title">Trending books</h2>

    <div class="books-section__heading">
      <h3 class="books-section__title">Books</h3>
      <p class="books-section__count" aria-live="polite"></p>
    </div>

    <div class="books-section__content">
      <nav class="books-section__categories-wrap" aria-label="Book categories">
        <ul
          class="books-section__categories list-reset"
          aria-label="Categories"
        ></ul>
      </nav>

      <div class="books-section__results">
        <p class="books-section__status" role="status" aria-live="polite"></p>
        <ul
          class="books-section__list list-reset"
          aria-label="Available books"
        ></ul>
        <button class="books-section__show-more" type="button" hidden>
          Show More
        </button>
      </div>
    </div>
  </div>
</section>
