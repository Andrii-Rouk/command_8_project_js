<header class="header" id="home">
  <div class="container header__container">
    <a class="header__logo" href="#home" aria-label="Booksy — на главную">
      <svg class="header__logo-icon" width="83" height="21" aria-hidden="true">
        <use href="./icons/sprite.svg#booksy-logo"></use>
      </svg>
    </a>

    <button
      class="header__menu-toggle"
      type="button"
      aria-label="Открыть меню"
      aria-controls="site-navigation"
      aria-expanded="false"
    >
      <svg class="header__menu-icon header__menu-icon--open" width="24" height="24" aria-hidden="true">
        <use href="./icons/sprite.svg#menu"></use>
      </svg>
      <svg class="header__menu-icon header__menu-icon--close" width="24" height="24" aria-hidden="true">
        <use href="./icons/sprite.svg#close"></use>
      </svg>
    </button>

    <nav class="header__navigation" id="site-navigation" aria-label="Главная навигация">
      <ul class="header__nav-list">
        <li><a class="header__nav-link" href="#books">Книги</a></li>
        <li><a class="header__nav-link" href="#feedbacks">Отзывы</a></li>
        <li><a class="header__nav-link" href="#events">События</a></li>
        <li><a class="header__nav-link" href="#location">Контакты</a></li>
      </ul>
    </nav>
  </div>
</header>
