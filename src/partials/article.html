<section class="article" id="article">
  <div class="container article__container">
    <div class="article__content">
      <h2 class="article__title">
        Welcome to Booksy &ndash; your cozy corner for handpicked reads.
      </h2>
      <p class="article__text">
        We believe books are more than just stories &mdash; they&rsquo;re
        companions, doorways, and memories. Whether you&rsquo;re chasing
        adventures or quiet moments, we&rsquo;re here to help you find your next
        favorite book.
      </p>
    </div>

    <div class="article__media">
      <picture>
        <source
          media="(min-width: 1440px)"
          srcset="
            ./img/desktop/article-bookstore-1x.webp 1x,
            ./img/desktop/article-bookstore-2x.webp 2x
          "
          type="image/webp"
        />
        <source
          media="(min-width: 768px)"
          srcset="
            ./img/tablet/article-bookstore-1x.webp 1x,
            ./img/tablet/article-bookstore-2x.webp 2x
          "
          type="image/webp"
        />
        <img
          class="article__image"
          src="./img/mobile/article-bookstore-1x.webp"
          srcset="./img/mobile/article-bookstore-2x.webp 2x"
          alt="A cozy independent bookstore interior with tall wooden shelves and warm lighting"
          width="343"
          height="248"
          loading="lazy"
        />
      </picture>
    </div>
  </div>
</section>
